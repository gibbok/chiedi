name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHIEDI_TEST_OCR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify dependency metadata
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || { cat go.mod; cat go.sum; exit 1; }
      - name: Install local PDF OCR test dependency
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: make verify
      - run: make verify-full
      - name: Verify standalone pure-Go build
        run: CGO_ENABLED=0 make build
