name: verify

on:
  push:
    branches: [main]
    tags: ["*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "website/**"
      - "LICENSE"
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "website/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      macos_package_smoke:
        description: Also run the package smoke test on macOS
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CHIEDI_TEST_OCR: '1'
      CHIEDI_ASSETS: ${{ github.workspace }}/bin/assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Restore native E5 downloads and assets
        uses: actions/cache@v4
        with:
          path: |
            .deps/downloads
            bin/assets
          key: e5-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native-assets.json', 'scripts/setup/main.go') }}
      - name: Prepare native E5 assets
        run: make setup
      - name: Verify dependency metadata
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || { cat go.mod; cat go.sum; exit 1; }
      - name: Install local PDF OCR test dependency
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            brew install tesseract
          else
            sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          fi
      - run: make verify
      - name: Build installation bundle
        if: matrix.os == 'ubuntu-latest' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.macos_package_smoke)
        run: make package
      - name: Smoke test relocated installation
        if: matrix.os == 'ubuntu-latest' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.macos_package_smoke)
        run: |
          mkdir -p "$RUNNER_TEMP/chiedi-install"
          PREFIX="$RUNNER_TEMP/chiedi-install" bash scripts/install.sh
          unset CHIEDI_ASSETS
          cd "$RUNNER_TEMP"
          mkdir -p smoke-corpus
          echo 'Employees have twenty days of paid vacation.' > smoke-corpus/leave.txt
          "$RUNNER_TEMP/chiedi-install/bin/chiedi" --db smoke.db add "$RUNNER_TEMP/smoke-corpus"
          "$RUNNER_TEMP/chiedi-install/bin/chiedi" --db smoke.db search 'Quanti giorni di ferie?' | tee smoke-result.txt
          grep -q 'leave.txt' smoke-result.txt
